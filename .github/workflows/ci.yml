name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero warnings allowed)
        run: npm run lint

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Runtime env verification
        run: npm run check:env

      - name: Vitest suite (all 8 suites including secrets scan & a11y)
        run: npm run test

      - name: Production build verification
        run: npm run build
